model:
  bert_name: bert-base-uncased
  pretrained: true
  local_files_only: false
  feature_dim: 256
  decoder_dim: 256
  pool_sizes: [8, 4, 2, 1]
  local_kernel: 3
  use_mfie: true
  use_afw: true
data:
  root: data/droneris
  train: annotations/train.jsonl
  val: annotations/val.jsonl
  image_size: 480
  max_text_length: 64
  evaluation_resolution: original
training:
  epochs: 50
  batch_size: 8
  lr: 0.00003
  min_lr: 0.000001
  weight_decay: 0.05
  betas: [0.9, 0.999]
  eps: 0.00000001
  dice_eps: 0.000001
  seed: 42
  amp: false
runtime:
  output: runs/droneris
  workers: 4
  device: cuda
