[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miawnet"
version = "0.1.0"
description = "Multi-scale interaction and adaptive weighting for referring image segmentation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0,<3", "torchvision>=0.15,<1", "transformers>=4.38,<5",
  "numpy>=1.24,<2", "Pillow>=9.5", "PyYAML>=6.0", "tqdm>=4.65"
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.8"]
refcoco = ["pycocotools>=2.0.7"]

[project.scripts]
miawnet-train = "miawnet.train:main"
miawnet-evaluate = "miawnet.evaluate:main"
miawnet-predict = "miawnet.predict:main"
miawnet-convert-refcoco = "miawnet.convert_refcoco:main"
miawnet-check-data = "miawnet.check_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
